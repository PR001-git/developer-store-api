name: Pull request

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: Ambev.DeveloperEvaluation.sln

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # Integration and functional tests start PostgreSQL through Testcontainers,
      # which uses the Docker engine that ubuntu-latest runners already have.
      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release --no-build
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Ambev.DeveloperEvaluation.WebApi/Dockerfile
          push: false
          tags: ambevdeveloperevaluationwebapi:pr-${{ github.event.pull_request.number || github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  portal:
    name: Portal build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run test:ci
