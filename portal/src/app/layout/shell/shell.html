<header class="shell-header">
  <div class="shell-header__bar">
    <a class="shell-header__wordmark" routerLink="/sales">DeveloperStore</a>

    <button
      type="button"
      class="shell-header__menu-toggle"
      aria-controls="main-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      Menu
    </button>

    <nav id="main-nav" class="shell-header__nav" aria-label="Main" [class.shell-header__nav--open]="menuOpen()">
      <a routerLink="/sales" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Sales</a>
      <a routerLink="/sales/new" routerLinkActive="is-active">New sale</a>
      <a routerLink="/account" routerLinkActive="is-active">Account</a>
    </nav>

    <div class="shell-header__account">
      @if (session(); as user) {
        <span class="shell-header__user-name">{{ user.name }}</span>
      }
      <button type="button" class="button" (click)="signOut()">Sign out</button>
    </div>
  </div>
</header>

<main class="shell-main">
  <router-outlet />
</main>

<app-toast />
